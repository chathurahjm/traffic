name: Run Traffic Notebook (Jupyter Automation)

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of visit iterations'
        required: false
        default: '10'

jobs:
  run-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google Chrome & Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y wget unzip jq curl
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium jupyter nbconvert papermill

      - name: Execute Jupyter Notebook (traficworking.ipynb)
        run: |
          echo "🚀 Executing docs/traficworking.ipynb..."
          papermill docs/traficworking.ipynb docs/traficworking_output.ipynb
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload Notebook Artifacts & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-execution-artifacts
          path: |
            docs/traficworking_output.ipynb
            *.png
            buster_extension/
