name: Daily Traffic Simulation

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: npm ci

      - name: Set Chrome Path
        run: echo "CHROME_BIN=$(which google-chrome)" >> $GITHUB_ENV

      - name: Start server
        run: |
          node server.js > server.log 2>&1 &
          sleep 10

      - name: Start simulator
        run: |
          curl -X POST http://localhost:3000/api/start

      - name: Stream logs until completion
        shell: bash
        run: |
          curl -s --no-buffer http://localhost:3000/api/stream | \
          while IFS= read -r line; do
            if [[ "$line" == data:* ]]; then
              DATA="${line#data: }"

              MSG=$(echo "$DATA" | jq -r '.message // empty' 2>/dev/null)
              TYPE=$(echo "$DATA" | jq -r '.type // empty' 2>/dev/null)

              if [ -n "$MSG" ]; then
                echo "[$TYPE] $MSG"
              fi

              STATUS=$(echo "$DATA" | jq -r '.status // empty' 2>/dev/null)

              if [ "$STATUS" = "idle" ]; then
                echo "✅ Simulation complete."
                pkill -f "curl.*api/stream" || true
                break
              fi
            fi
          done

      - name: Show server log if failed
        if: failure()
        run: cat server.log