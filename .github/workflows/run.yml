name: Daily Traffic Simulation

on:
  schedule:
    - cron: '0 */7 * * *'
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Install dependencies
        run: npm ci

      - name: Install and start TOR service
        run: |
          sudo apt-get update && sudo apt-get install -y tor
          sudo service tor start
          sleep 5
          echo "🧅 TOR SOCKS5 service active on 127.0.0.1:9050"

      - name: Fetch and test live proxies
        run: node fetch_proxies.js

      - name: Set Chrome Path
        run: |
          CHROME_PATH="${{ steps.setup-chrome.outputs.chrome-path }}"
          if [ -z "$CHROME_PATH" ] || [ ! -f "$CHROME_PATH" ]; then
            CHROME_PATH=$(which google-chrome || which google-chrome-stable || which chromium || echo "")
          fi
          echo "CHROME_BIN=$CHROME_PATH" >> $GITHUB_ENV
          echo "✅ Using Chrome binary: $CHROME_PATH"

      - name: Start server
        run: |
          node server.js > server.log 2>&1 &
          echo "Waiting for server to start..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:3000/api/status > /dev/null 2>&1; then
              echo "✅ Server is ready."
              break
            fi
            sleep 2
          done

      - name: Start simulator
        run: |
          RESULT=$(curl -s -X POST http://127.0.0.1:3000/api/start)
          echo "Start response: $RESULT"
          STATUS=$(echo "$RESULT" | jq -r '.stats.status // empty' 2>/dev/null)
          if [ "$STATUS" != "running" ]; then
            echo "❌ Failed to start simulator. Response: $RESULT"
            if [ -f server.log ]; then cat server.log; fi
            if [ -f server_err.log ]; then cat server_err.log; fi
            exit 1
          fi
          echo "✅ Simulator started."

      - name: Wait for simulation to complete
        run: |
          echo "Polling simulation status..."
          while true; do
            RESPONSE=$(curl -s http://127.0.0.1:3000/api/status)
            STATUS=$(echo "$RESPONSE" | jq -r '.stats.status // empty' 2>/dev/null)
            COMPLETED=$(echo "$RESPONSE" | jq -r '.stats.visitsCompleted // 0' 2>/dev/null)
            FAILED=$(echo "$RESPONSE" | jq -r '.stats.visitsFailed // 0' 2>/dev/null)
            TOTAL=$(echo "$RESPONSE" | jq -r '.config.totalVisits // 0' 2>/dev/null)
            echo "[$(date -u '+%H:%M:%S')] Status: $STATUS | Completed: $COMPLETED | Failed: $FAILED | Total: $TOTAL"
            
            if [ "$STATUS" = "idle" ]; then
              if [ "$COMPLETED" -gt 0 ]; then
                echo "✅ Simulation complete. Completed: $COMPLETED, Failed: $FAILED"
                break
              else
                echo "❌ Simulation finished with 0 completed visits ($FAILED failed)."
                if [ -f server.log ]; then cat server.log; fi
                if [ -f server_err.log ]; then cat server_err.log; fi
                exit 1
              fi
            fi
            sleep 15
          done

      - name: Show server log on failure
        if: failure()
        run: |
          if [ -f server.log ]; then
            echo "=== SERVER LOG ==="
            cat server.log
          fi
          if [ -f server_err.log ]; then
            echo "=== SERVER ERROR LOG ==="
            cat server_err.log
          fi
