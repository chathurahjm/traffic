name: Daily Traffic Simulation

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: npm ci

      - name: Set Chrome Path
        run: echo "CHROME_BIN=$(which google-chrome)" >> $GITHUB_ENV

      - name: Start server
        run: |
          node server.js > server.log 2>&1 &
          echo "Waiting for server to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/api/status > /dev/null 2>&1; then
              echo "✅ Server is ready."
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Start simulator
        run: |
          RESULT=$(curl -s -X POST http://localhost:3000/api/start)
          echo "Start response: $RESULT"
          STATUS=$(echo "$RESULT" | jq -r '.stats.status // empty' 2>/dev/null)
          if [ "$STATUS" != "running" ]; then
            echo "❌ Failed to start simulator. Response: $RESULT"
            exit 1
          fi
          echo "✅ Simulator started."

      - name: Wait for simulation to complete
        shell: bash
        run: |
          echo "Polling simulation status..."
          while true; do
            RESPONSE=$(curl -s http://localhost:3000/api/status)
            STATUS=$(echo "$RESPONSE" | jq -r '.stats.status // empty' 2>/dev/null)
            COMPLETED=$(echo "$RESPONSE" | jq -r '.stats.visitsCompleted // 0' 2>/dev/null)
            FAILED=$(echo "$RESPONSE" | jq -r '.stats.visitsFailed // 0' 2>/dev/null)
            TOTAL=$(echo "$RESPONSE" | jq -r '.config.totalVisits // 0' 2>/dev/null)
            echo "[$(date -u '+%H:%M:%S')] Status: $STATUS | Completed: $COMPLETED | Failed: $FAILED | Total: $TOTAL"
            if [ "$STATUS" = "idle" ] && [ "$COMPLETED" -gt 0 ]; then
              echo "✅ Simulation complete. Completed: $COMPLETED, Failed: $FAILED"
              break
            fi
            sleep 30
          done

      - name: Show server log if failed
        if: failure()
        run: cat server.log