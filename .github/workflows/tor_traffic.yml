name: Tor Puppeteer Traffic Generator

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target website URL'
        required: false
        default: 'http://justpasteit.in/'
      sessions:
        description: 'Number of sessions to run'
        required: false
        default: '20'
  schedule:
    # Run every 6 hours automatically
    - cron: '0 */1 * * *'

jobs:
  tor-traffic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tor, ffmpeg & Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tor ffmpeg chromium-browser
          sudo service tor start
          sleep 5
          sudo service tor status

      - name: Install Node dependencies
        run: |
          cd tor_demo
          npm install

      - name: Run Tor Puppeteer Traffic Generator with GA Event Capture
        run: |
          cd tor_demo
          node tor_runner.js "${{ github.event.inputs.sessions || '20' }}" "${{ github.event.inputs.target_url || 'http://justpasteit.in/' }}" --headless

      - name: Upload Session Video Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tor-puppeteer-execution-videos
          path: tor_demo/videos/*.mp4
          retention-days: 7
