name: Page Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

jobs:

  screenshot:

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    env:
      TARGET_URL: https://example.com

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx playwright install chromium --with-deps
        if: runner.os == 'Linux'

      - run: npx playwright install chromium
        if: runner.os != 'Linux'

      - run: npm run monitor

      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-${{ matrix.os }}
          path: screenshots